<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケモン交換会 サムネイル作成ツール</title>
  <!-- cssフォルダ配下のスタイルシートを参照 -->
  <link rel="stylesheet" href="css/style.css">
  <!-- ZIP解凍用ライブラリ (JSZip) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

  <!-- 設定パネル -->
  <div class="sidebar">
    <!-- 設定ファイルの保存 / 読み込みボタン -->
    <div class="config-action-area">
      <button class="btn-config" onclick="exportConfig()">⚙️ 設定保存 (config.json)</button>
      <button class="btn-config" onclick="document.getElementById('configFileInput').click()">📂 設定読込 (.json)</button>
      <input type="file" id="configFileInput" accept=".json" style="display: none;" onchange="importConfig(this.files[0])">
    </div>

    <!-- ZIP一括読み込み＆ドラッグアンドドロップエリア (ZIPとJSON両方対応) -->
    <div class="zip-drop-zone" id="dropZone" onclick="document.getElementById('zipFileInput').click()">
      <p>📦 ZIP または JSON をここにドロップ</p>
      <span>またはクリックしてファイルを選択<br>(画像・フォントZIP、または設定config.jsonをまとめてD&D可能)</span>
      <input type="file" id="zipFileInput" accept=".zip,.json" style="display: none;" onchange="handleFilesUpload(this.files)">
    </div>

    <div class="tab-header">
      <button class="tab-btn active" onclick="switchTab('tab-bg', event)">外枠・背景</button>
      <button class="tab-btn" onclick="switchTab('tab-logo', event)">ロゴ</button>
      <button class="tab-btn" onclick="switchTab('tab-title', event)">タイトル</button>
      <button class="tab-btn" onclick="switchTab('tab-pokemon', event)">ポケモン設定</button>
    </div>

    <!-- 1. 外枠・背景設定 -->
    <div id="tab-bg" class="tab-content active">
      <div class="form-group">
        <label>背景画像選択 (back)</label>
        <select id="bgSelect" class="form-control" onchange="updateCanvas()"></select>
      </div>
      <hr class="separator">
      <div class="form-group">
        <label>外枠のモード</label>
        <select id="borderMode" class="form-control" onchange="updateCanvas()">
          <option value="single">1色のみ</option>
          <option value="gradient" selected>2色グラデーション</option>
        </select>
      </div>
      <div class="form-group">
        <label>外枠の太さ (px)</label>
        <input type="number" id="borderWidth" class="form-control" value="20" min="0" max="100" oninput="updateCanvas()">
      </div>
      <div class="row">
        <div class="col form-group">
          <label>枠色 1</label>
          <div class="color-picker-group">
            <input type="color" id="borderColor1" value="#c026d3" onchange="syncColorInput('borderColor1', 'borderColor1Text'); updateCanvas();">
            <input type="text" id="borderColor1Text" class="form-control" value="#C026D3" oninput="syncColorPicker('borderColor1Text', 'borderColor1'); updateCanvas();">
          </div>
        </div>
        <div class="col form-group">
          <label>枠色 2</label>
          <div class="color-picker-group">
            <input type="color" id="borderColor2" value="#2563eb" onchange="syncColorInput('borderColor2', 'borderColor2Text'); updateCanvas();">
            <input type="text" id="borderColor2Text" class="form-control" value="#2563EB" oninput="syncColorPicker('borderColor2Text', 'borderColor2'); updateCanvas();">
          </div>
        </div>
      </div>
    </div>

    <!-- 2. ロゴ設定 -->
    <div id="tab-logo" class="tab-content">
      <div id="logoContainer"></div>
      <button class="btn btn-secondary" style="width: 100%;" onclick="addLogoSlot()">+ ロゴを追加</button>
    </div>

    <!-- 3. タイトル設定（複数対応・フォント動的読込対応） -->
    <div id="tab-title" class="tab-content">
      <div id="titleContainer"></div>
      <button class="btn btn-secondary" style="width: 100%;" onclick="addTitleSlot()">+ タイトルを追加</button>
    </div>

    <!-- 4. ポケモン・ボール・アイコンスロット -->
    <div id="tab-pokemon" class="tab-content">
      <div id="pokemonSlotsContainer"></div>
      <button class="btn btn-secondary" style="width: 100%;" onclick="addPokemonSlot()">+ ポケモンスロットを追加</button>
    </div>
  </div>

  <!-- プレビューと操作エリア -->
  <div class="main-content">
    <div class="hint-box">
      💡 タイトルは複数追加可能で、それぞれ個別に色・縁取り・グラデーションを設定できます！
    </div>
    <div class="canvas-container">
      <canvas id="thumbnailCanvas" width="1280" height="720"></canvas>
    </div>
    <div class="action-bar">
      <button class="btn btn-primary" onclick="saveImage()">画像を保存 (ダイアログ表示)</button>
    </div>
  </div>

  <!-- jsフォルダ配下のメインスクリプトを参照 -->
  <script src="js/main.js" defer></script>
</body>
</html>
